<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelSieve Studio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <span class="brand">VoxelSieve</span>
  <span id="project-name" class="project-name">No project</span>
  <nav class="actions">
    <button id="btn-new" title="New project">New</button>
    <button id="btn-open" title="Open project">Open</button>
    <button id="btn-save-as" title="Copy the project to a new directory" disabled>Save as</button>
    <span class="sep"></span>
    <button id="btn-undo" title="Undo the last step" disabled>↶ Undo</button>
    <button id="btn-redo" title="Redo the step" disabled>↷ Redo</button>
  </nav>
</header>
<div id="error" class="error" hidden></div>
<div id="busy" class="busy" hidden>
  <span id="busy-text"></span>
  <progress id="busy-progress" max="1"></progress>
  <figure id="busy-preview" class="busy-preview" hidden>
    <img id="busy-preview-image" alt="First look at the volume being imported">
    <figcaption id="busy-preview-text"></figcaption>
  </figure>
</div>
<main>
  <aside>
    <h2>Protocol</h2>
    <p class="hint" id="protocol-empty">No steps yet. Every step is recorded here with its parameters
      and result, and can be undone.</p>
    <ol id="protocol"></ol>
  </aside>
  <section id="workspace">
    <div id="welcome" class="panel">
      <h1>From CT scan to test report</h1>
      <p>A project records every step and is always saved.</p>
      <p><button class="primary" id="welcome-new">New project</button>
        <button id="welcome-open">Open project</button></p>
    </div>
    <div id="wizard" hidden>
      <ol class="stages">
        <li><button data-stage="dataset"><b>1</b> Dataset</button></li>
        <li><button data-stage="analysis"><b>2</b> Analysis</button></li>
        <li><button data-stage="report"><b>3</b> Report</button></li>
        <li class="view-stage"><button data-stage="view">View</button></li>
      </ol>
      <div class="panel" id="stage"></div>
    </div>
  </section>
</main>
<dialog id="browser">
  <form method="dialog">
    <h2 id="browser-title">Choose a file</h2>
    <div class="path-row"><button type="button" id="browser-up" title="Parent directory">↑</button>
      <input id="browser-path" spellcheck="false"></div>
    <ul id="browser-list"></ul>
    <div id="browser-name-row" class="name-row" hidden><label>Name <input id="browser-name"
      spellcheck="false"></label></div>
    <div class="dialog-buttons">
      <button value="cancel">Cancel</button>
      <button type="button" class="primary" id="browser-ok">Select</button>
    </div>
  </form>
</dialog>
<script src="viewer.js"></script>
<script src="transfer.js"></script>
<script src="volume.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
