name: Feature request
description: An analysis, data format or improvement you need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to achieve
      description: The inspection task or workflow, not only the feature, so we can find the best way to support it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The steps or tools you use now and what takes time.
  - type: textarea
    id: data
    attributes:
      label: Data
      description: Typical scan sizes, formats and parts (castings, welds, batteries, ...).
