name: Nightly

# Long checks that would slow every pull request: the scale tests and benchmark on larger
# phantoms, and ThreadSanitizer, which needs every dependency built for it.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  VCPKG_ROOT: /home/runner/vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:
  scale:
    name: Scale tests and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive \
            automake libtool pkg-config
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      # The binary cache of the CI workflow (same key), filled by its dependencies job on main.
      - name: Cache key
        id: key
        run: |
          echo "key=vcpkg-$(g++ -dumpfullversion)-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}" >> "$GITHUB_OUTPUT"
          echo "prefix=vcpkg-$(g++ -dumpfullversion)-" >> "$GITHUB_OUTPUT"
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Configure
        run: cmake --preset release -DVOXELSIEVE_SCALE_TESTS=ON
      - name: Build
        run: cmake --build --preset release
      - name: Scale tests (512^3 against tests/scale_limits.json)
        run: ctest --test-dir build/release -L scale --output-on-failure
      - name: Benchmark (256^3 to 1024^3)
        if: always()
        # Denoising alone takes longer than all the other tools together at 1024^3.
        run: >-
          cmake -DBIN=build/release/bin -DWORK=${{ runner.temp }}/scale
          "-DSIZES=256;512;1024"
          "-DSTEPS=porosity;surface;segment;thickness;thicknessmap;compare;report"
          -DRECORD=${{ runner.temp }}/scale_limits.json
          -P tools/bench/scale.cmake
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-results
          path: |
            ${{ runner.temp }}/scale/scale.csv
            ${{ runner.temp }}/scale/*/*.telemetry.json
            ${{ runner.temp }}/scale/*/*.log
            ${{ runner.temp }}/scale_limits.json
            build/release/tests/scale_512.csv
          if-no-files-found: ignore

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive \
            automake libtool pkg-config
      # TSan cannot map its shadow memory with the address randomisation of recent kernels.
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      # The dependencies built for TSan have their own cache. A first run may hit the timeout
      # while building them; what it built is kept and the next run continues from it.
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tsan-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
          restore-keys: |
            tsan-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-
            tsan-vcpkg-
      - name: Configure
        id: configure
        timeout-minutes: 240
        run: cmake --preset tsan
      - name: Save binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tsan-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
      - name: Save partial binary cache
        if: failure() && steps.configure.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: tsan-vcpkg-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        run: ctest --preset tsan --parallel "$(nproc)" --timeout 1800
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-tsan
          path: build/vcpkg_installed_tsan/vcpkg/blds/**/*.log
          if-no-files-found: ignore
