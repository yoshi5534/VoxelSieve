name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependencies come from vcpkg (ADR 0016), pinned by the builtin-baseline in vcpkg.json. Built
# packages are kept in vcpkg's binary cache (~/.cache/vcpkg/archives), which the first job fills
# once per vcpkg.json and compiler and the others restore.
env:
  VCPKG_ROOT: /home/runner/vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:
  # A pull request that changes only documents (docs/ without the schemas, which a test reads,
  # the site and the Markdown files at the top) needs no build: the other jobs are skipped.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for changes outside the documents
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files="$(git diff --name-only "$BASE"...HEAD)"
            other="$(grep -v -E '^(docs/|site/|[^/]+\.md$)' <<<"$files" || true)"
            schemas="$(grep -E '^docs/schema/' <<<"$files" || true)"
            if [[ -n "$files" && -z "$other" && -z "$schemas" ]]; then
              code=false
            fi
            echo "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  dependencies:
    name: vcpkg dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Building OpenVDB, Boost and TBB from source takes long, but only when vcpkg.json changes.
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive \
            automake libtool pkg-config
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Cache key
        id: key
        run: |
          echo "key=vcpkg-$(g++ -dumpfullversion)-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.key.outputs.key }}
          restore-keys: vcpkg-
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --preset release
      - name: Save binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.key.outputs.key }}
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: build/vcpkg_installed/vcpkg/blds/**/*.log
          if-no-files-found: ignore

  build-test:
    name: Build and test (${{ matrix.preset }})
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true
      # The release build also builds the Python package and runs its tests (ADR 0031).
      - name: Set up Python
        if: matrix.preset == 'release'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nanobind and numpy
        if: matrix.preset == 'release'
        run: python -m pip install nanobind numpy
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${{ matrix.preset == 'release' && '-DVOXELSIEVE_BUILD_PYTHON=ON' || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # The ASan preset builds with -O1 and line tables only (-g1): at -O0 the tests took three
        # times as long, and full debug info makes the -O1 build much slower.
        run: >-
          ctest --preset ${{ matrix.preset }} --parallel "$(nproc)"
          --timeout ${{ matrix.preset == 'asan' && 1200 || 600 }}

  lint:
    name: Format and clang-tidy
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nanobind
        run: python -m pip install nanobind
      # With the Python module, so that clang-tidy checks python/core.cpp too.
      - name: Configure
        run: cmake --preset debug -DVOXELSIEVE_BUILD_PYTHON=ON
      - name: clang-format and clang-tidy
        run: tools/lint.sh build/debug

  # The Python package as users install it: `pip install .` with the dependencies from vcpkg, then
  # its tests on the installed package, outside the source tree (ADR 0031).
  python-package:
    name: Python package (pip install)
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: pip install
        run: python -m pip install -v .
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import voxelsieve, pathlib; print(voxelsieve.__version__, pathlib.Path(voxelsieve.__file__).parent)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -v

  # Windows and macOS: the release preset of each platform, built and tested like on Linux. Each
  # keeps its own vcpkg binary cache; the first run builds the dependencies from source.
  platforms:
    name: Build and test (${{ matrix.preset }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows
          - os: macos-15
            preset: macos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        run: |
          temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "$temp/vcpkg-archives"
          VCPKG_ROOT="$temp/vcpkg" tools/setup-vcpkg.sh
      # A first run may hit the job timeout while building the dependencies; what it built is
      # kept as a partial cache that the next run continues from.
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
          restore-keys: |
            vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-
            vcpkg-${{ matrix.preset }}-
      - name: Configure
        id: configure
        timeout-minutes: 150
        run: cmake --preset ${{ matrix.preset }}
      - name: Save binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
      - name: Save partial binary cache
        if: failure() && steps.configure.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build
        # Keep going after errors, so one run shows every file a compiler disagrees with.
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 600 --parallel 4
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: build/vcpkg_installed/vcpkg/blds/**/*.log
          if-no-files-found: ignore
