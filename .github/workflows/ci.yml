name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependencies come from vcpkg (ADR 0016), pinned by the builtin-baseline in vcpkg.json. Built
# packages are kept in vcpkg's binary cache (~/.cache/vcpkg/archives), which the first job fills
# once per vcpkg.json and compiler and the others restore.
env:
  VCPKG_ROOT: /home/runner/vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:
  dependencies:
    name: vcpkg dependencies
    runs-on: ubuntu-24.04
    # Building OpenVDB, Boost and TBB from source takes long, but only when vcpkg.json changes.
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive \
            automake libtool pkg-config
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Cache key
        id: key
        run: |
          echo "key=vcpkg-$(g++ -dumpfullversion)-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.key.outputs.key }}
          restore-keys: vcpkg-
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --preset release
      - name: Save binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.key.outputs.key }}
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: build/vcpkg_installed/vcpkg/blds/**/*.log
          if-no-files-found: ignore

  build-test:
    name: Build and test (${{ matrix.preset }})
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 600 --parallel "$(nproc)"

  lint:
    name: Format and clang-tidy
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy
      - name: Set up vcpkg
        run: tools/setup-vcpkg.sh
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ needs.dependencies.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Configure
        run: cmake --preset debug
      - name: clang-format and clang-tidy
        run: tools/lint.sh build/debug

  # Windows and macOS: the release preset of each platform, built and tested like on Linux. Each
  # keeps its own vcpkg binary cache; the first run builds the dependencies from source.
  platforms:
    name: Build and test (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows
          - os: macos-15
            preset: macos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        run: |
          temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-archives" >> "$GITHUB_ENV"
          mkdir -p "$temp/vcpkg-archives"
          VCPKG_ROOT="$temp/vcpkg" tools/setup-vcpkg.sh
      # A first run may hit the job timeout while building the dependencies; what it built is
      # kept as a partial cache that the next run continues from.
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
          restore-keys: |
            vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-
            vcpkg-${{ matrix.preset }}-
      - name: Configure
        id: configure
        timeout-minutes: 150
        run: cmake --preset ${{ matrix.preset }}
      - name: Save binary cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete
      - name: Save partial binary cache
        if: failure() && steps.configure.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 600 --parallel 4
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: build/vcpkg_installed/vcpkg/blds/**/*.log
          if-no-files-found: ignore
