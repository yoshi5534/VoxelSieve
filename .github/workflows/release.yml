name: Packages

# Builds the self-contained packages of VoxelSieve for Linux, Windows and macOS: an archive of the
# installed tree (programs, libraries, examples, licenses) and an MCP bundle (.mcpb) for one-click
# installation in Claude Desktop. The Linux job also writes the sample data of the quickstart and
# builds and checks the Docker image from its package. When a release is published on GitHub, the
# packages and the sample data are attached to it, with server.json, the entry of the bundles for
# the official MCP registry; otherwise they are workflow artifacts. Publishing stays a manual
# step: the image is pushed to ghcr.io only for a release and only once the repository variable
# PUBLISH_IMAGE is true, and the registry entry is published by hand with mcp-publisher. All packages carry the version of the release tag (v0.3.1 gives
# voxelsieve-0.3.1-*). Run by hand with a tag, the workflow rebuilds that release's packages and
# replaces the ones attached to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose packages to rebuild and replace (empty builds the branch)
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - cmake/Install.cmake
      - docs/quickstart.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: release
            platform: linux
            arch: x64
          - os: windows-2022
            preset: windows
            platform: win32
            arch: x64
          - os: macos-15
            preset: macos
            platform: darwin
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version
        id: version
        run: |
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
          else
            version="$(sed -n 's/^  set(VOXELSIEVE_VERSION \([0-9.]*\))$/\1/p' CMakeLists.txt)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version x.y.z in tag '$TAG' or CMakeLists.txt (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive \
            automake libtool pkg-config
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        id: vcpkg
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # The same cache as the Linux CI jobs.
            echo "VCPKG_ROOT=/home/runner/vcpkg" >> "$GITHUB_ENV"
            echo "archives=$HOME/.cache/vcpkg/archives" >> "$GITHUB_OUTPUT"
            echo "key=vcpkg-$(g++ -dumpfullversion)-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}" >> "$GITHUB_OUTPUT"
            VCPKG_ROOT=/home/runner/vcpkg tools/setup-vcpkg.sh
          else
            temp="$RUNNER_TEMP"
            if [[ "$RUNNER_OS" == Windows ]]; then temp="$(cygpath -m "$RUNNER_TEMP")"; fi
            echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-archives" >> "$GITHUB_ENV"
            mkdir -p "$temp/vcpkg-archives"
            echo "archives=$temp/vcpkg-archives" >> "$GITHUB_OUTPUT"
            echo "key=vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-complete" >> "$GITHUB_OUTPUT"
            VCPKG_ROOT="$temp/vcpkg" tools/setup-vcpkg.sh
          fi
      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg.outputs.archives }}
          key: ${{ steps.vcpkg.outputs.key }}
      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} -DVOXELSIEVE_BUILD_TESTS=OFF -DVOXELSIEVE_INSTALL_RUNTIME_DEPS=ON \
            -DVOXELSIEVE_VERSION=${{ steps.version.outputs.version }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Install
        id: install
        run: |
          version="${{ steps.version.outputs.version }}"
          name="voxelsieve-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          cmake --install build/${{ matrix.preset }} --prefix "stage/$name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Check that the installed tree runs on its own
        run: |
          # The MCP server answers tools/list with the bundled libraries only (the build tree and
          # vcpkg are moved away first).
          mv build build-moved
          mkdir -p check
          # Releases before 0.3.1 named the server vs-studio.
          bin="stage/${{ steps.install.outputs.name }}/bin"
          server="$bin/vs-gui"
          if [[ ! -e "$server" && ! -e "$server.exe" ]]; then server="$bin/vs-studio"; fi
          "$server" --mcp check < tests/mcp_tools_list.jsonl > tools.json
          grep -q run_porosity tools.json
          mv build-moved build
      - name: Pack
        run: |
          name="${{ steps.install.outputs.name }}"
          mkdir -p dist
          cmake -DSTAGE="stage/$name" -DOUT="dist/$name.mcpb" -DVERSION="${{ steps.install.outputs.version }}" \
            -DPLATFORM=${{ matrix.platform }} -P packaging/make-mcpb.cmake
          cd stage
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake -E tar cf "../dist/$name.zip" --format=zip "$name"
          else
            tar czf "../dist/$name.tar.gz" "$name"
          fi
      - name: Sample data (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -DSYNTH="stage/${{ steps.install.outputs.name }}/bin/vs-synth" \
            -DORDER=examples/inspection_order.json \
            -DOUT="dist/voxelsieve-${{ steps.install.outputs.version }}-samples.zip" \
            -P packaging/make-samples.cmake
      - name: Docker image (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${{ steps.install.outputs.version }}"
          docker build -f packaging/Dockerfile --build-arg PACKAGE="${{ steps.install.outputs.name }}" \
            --build-arg VERSION="$version" -t "voxelsieve:$version" stage
          # The image answers tools/list over MCP on its own.
          docker run -i --rm "voxelsieve:$version" --mcp /data < tests/mcp_tools_list.jsonl > image-tools.json
          grep -q run_porosity image-tools.json
      - name: Push the Docker image (Linux)
        # Off until the maintainer sets the repository variable PUBLISH_IMAGE to true (Settings >
        # Secrets and variables > Actions > Variables). A new package on ghcr.io starts private.
        if: runner.os == 'Linux' && env.TAG != '' && vars.PUBLISH_IMAGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.install.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voxelsieve"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "voxelsieve:$version" "$image:$version"
          docker tag "voxelsieve:$version" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.install.outputs.name }}
          path: dist/*
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Packages of this platform under another name (an older build with a wrong version)
          # are removed, so the release holds one set per platform.
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
            if [[ "$asset" =~ ^voxelsieve-.*-${{ matrix.platform }}-${{ matrix.arch }}\.(mcpb|zip|tar\.gz)$ ||
                  ( "$RUNNER_OS" == Linux && "$asset" =~ ^voxelsieve-.*-samples\.zip$ ) ]] &&
               [[ ! -e "dist/$asset" ]]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
          gh release upload "$TAG" dist/* --clobber

  registry:
    # server.json for the official MCP registry: the three bundles of this release with their
    # download links and SHA-256 hashes, and the Docker image when it is pushed (PUBLISH_IMAGE).
    # Without a tag (pull requests, branch runs) the links name the tag the version would get, so
    # the file can be checked.
    name: MCP registry entry
    needs: package
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISH_IMAGE: ${{ vars.PUBLISH_IMAGE }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voxelsieve-*
          path: dist
          merge-multiple: true
      - name: Write server.json
        run: |
          shopt -s nullglob
          bundles=(dist/*.mcpb)
          if [[ ${#bundles[@]} -ne 3 ]]; then
            echo "::error::Expected 3 MCP bundles, found ${#bundles[@]}"
            exit 1
          fi
          version="$(basename "${bundles[0]}" | sed -n 's/^voxelsieve-\([0-9.]*\)-.*\.mcpb$/\1/p')"
          tag="${TAG:-v$version}"
          packages='[]'
          for bundle in "${bundles[@]}"; do
            name="$(basename "$bundle")"
            packages="$(jq -c --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$name" \
              --arg sha "$(sha256sum "$bundle" | cut -d' ' -f1)" \
              '. + [{registryType: "mcpb", identifier: $url, fileSha256: $sha, transport: {type: "stdio"}}]' \
              <<< "$packages")"
          done
          # The image starts the browser UI by default; MCP clients run it with --mcp on the
          # scan directory mounted at /data.
          if [[ "$PUBLISH_IMAGE" == "true" ]]; then
            packages="$(jq -c --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voxelsieve:$version" '. + [{
              registryType: "oci",
              identifier: $image,
              runtimeHint: "docker",
              transport: {type: "stdio"},
              runtimeArguments: [
                {type: "named", name: "--mount", value: "type=bind,src={scan_dir},dst=/data",
                 description: "Directory with the CT scans; VoxelSieve reads and writes only there",
                 isRequired: true,
                 variables: {scan_dir: {description: "Directory with the CT scans",
                                        format: "filepath", isRequired: true}}},
                {type: "named", name: "--user", value: "{uid_gid}",
                 description: "User and group id that may write to the scan directory (id -u):(id -g)",
                 variables: {uid_gid: {description: "For example 1000:1000", default: "1000:1000"}}}
              ],
              packageArguments: [
                {type: "positional", value: "--mcp"},
                {type: "positional", value: "/data"}
              ]
            }]' <<< "$packages")"
          fi
          jq -n --arg version "$version" --argjson packages "$packages" '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: "io.github.yoshi5534/voxelsieve",
            title: "VoxelSieve",
            description: "Analyse industrial CT scans locally: porosity, CAD comparison and inspection reports",
            repository: {url: "https://github.com/yoshi5534/VoxelSieve", source: "github"},
            websiteUrl: "https://github.com/yoshi5534/VoxelSieve/blob/main/docs/quickstart.md",
            version: $version,
            packages: $packages
          }' > server.json
          cat server.json
          # The registry allows at most 100 characters of description.
          test "$(jq -r .description server.json | wc -m)" -le 101
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-registry
          path: server.json
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" server.json --clobber --repo "$GITHUB_REPOSITORY"
