# The Python package (ADR 0031): `pip install .` builds libvoxelsieve and the extension module with
# CMake. The C++ dependencies come from vcpkg as for the tools: export VCPKG_ROOT first
# (tools/setup-vcpkg.sh). See docs/python.md.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "voxelsieve"
dynamic = ["version"]
description = "Sieved, out-of-core industrial CT volumes on OpenVDB: numpy access and analyses"
readme = "docs/python.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/yoshi5534/VoxelSieve"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python-{wheel_tag}"
wheel.packages = []
sdist.exclude = ["build", "site", "docs/images", ".github"]
# Only the library and the extension module: no tools, no C++ tests.
build.targets = ["_core"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'set\(VOXELSIEVE_VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)\)'

[tool.scikit-build.cmake.define]
VOXELSIEVE_BUILD_PYTHON = "ON"
VOXELSIEVE_BUILD_APPS = "OFF"
VOXELSIEVE_BUILD_TESTS = "OFF"
